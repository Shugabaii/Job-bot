name: Build CareerPilot AI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
      - run: flutter clean
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: CareerPilot-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
