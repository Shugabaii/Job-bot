name: Build CareerPilot AI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || echo "Analyze warnings - continue"

      - name: Run tests
        run: flutter test || echo "No tests yet - skipping"

      - name: Build Release APK - Split per ABI
        run: flutter build apk --release --split-per-abi --dart-define=BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}

      - name: List APKs
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload CareerPilot AI APKs
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilot-AI-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CareerPilot AI v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
