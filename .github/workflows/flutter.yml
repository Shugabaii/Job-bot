name: Build CareerPilot AI APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test || echo "No tests yet - skipping"

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}

      - name: Rename APK to CareerPilot AI
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CareerPilot-AI.apk

      - name: Upload CareerPilot AI APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerPilot-AI-APK
          path: build/app/outputs/flutter-apk/CareerPilot-AI.apk
          retention-days: 30