name: Build CareerPilot AI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      - run: flutter clean
      - run: flutter pub get
      - name: Build APK with retry for 429
        run: |
          SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "=== Build attempt $i ==="
            if flutter build apk --release --android-skip-build-dependency-validation; then
              SUCCESS=1
              break
            fi
            echo "Attempt $i failed, waiting 90s..."
            sleep 90
          done
          if [ $SUCCESS -eq 0 ]; then
            echo "All 5 attempts failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CareerPilot-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
