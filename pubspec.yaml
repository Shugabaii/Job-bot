name: careerpilot_ai
description: "CareerPilot AI - Professional Outreach Dashboard"
publish_to: 'none'
version: 4.4.0+8

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.0
  cloud_firestore: ^5.4.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.14.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# FIX for: decodeLazy isn't defined for ZLibDecoder
# This forces the versions that work together
dependency_overrides:
  archive: 4.0.7
  image: 4.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E2A5A"
  adaptive_icon_foreground: "assets/icon.png"
